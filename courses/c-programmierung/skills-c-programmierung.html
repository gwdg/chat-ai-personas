<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Themen & Fähigkeiten prüfen | GAIA</title>
  <style>
:root {
  --base-100: #ffffff;
  --base-200: #f5f6f7;
  --base-300: #e0e3e7;
  --line-soft: rgba(16, 24, 40, .08);
  --base-content: #20242b;
  --muted: #667085;
  --primary: #344054;
  --success: #2e7d55;
  --error: #b42318;
  --font-sans: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; color-scheme: light; }
body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--base-200);
  color: var(--base-content);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--primary); text-decoration: underline; text-underline-offset: .15em; }
h1, h2, h3, h4, p { margin-top: 0; }
code, pre { font-family: var(--font-mono); }
.muted { color: var(--muted); }
.icon {
  width: 1em; height: 1em; display: inline-block; flex: none;
  stroke: currentColor; fill: none; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; vertical-align: -.14em;
}
.icon-xs { width: .8em; height: .8em; }

/* ---------- Shell ---------- */
.shell { max-width: 1120px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 1.5rem; margin: 0 0 1.1rem;
}
.page-head h1 { margin: 0 0 .2rem; font-size: 1.4rem; line-height: 1.2; letter-spacing: -.01em; }
.lede { margin: 0; max-width: 62ch; color: var(--muted); font-size: .9rem; }
.view-mark { flex: none; padding-top: .25rem; color: var(--muted); font-size: .75rem; }

/* ---------- Alerts ---------- */
.alerts { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
.alerts:empty { display: none; }
.alert {
  display: flex; gap: .55rem; padding: .6rem .8rem;
  border: 1px solid var(--base-300); border-left-width: 3px; border-radius: 6px;
  font-size: .8rem;
}
.alert-icon { margin-top: .1rem; font-size: 1.05rem; flex: none; }
.alert-main { min-width: 0; }
.alert-main strong { display: block; margin-bottom: .15rem; font-size: .83rem; }
.alert ul { margin: .1rem 0 0; padding-left: 1.1rem; }
.alert li { margin: .08rem 0; }
.alert details { margin-top: .25rem; }
.alert summary { cursor: pointer; font-weight: 700; }
.alert-error { border-color: rgba(180, 35, 24, .34); background: rgba(180, 35, 24, .06); color: #8a1c14; }
.alert-warning { border-color: rgba(161, 92, 10, .36); background: rgba(161, 92, 10, .07); color: #7a4608; }
.alert-hint { margin: .6rem 0 0; font-size: .82rem; }
.alert-detail { margin-top: .4rem; }
.alert-detail pre { white-space: pre-wrap; word-break: break-word; font-size: .78rem; background: rgba(16, 24, 40, .05); padding: .45rem .55rem; border-radius: 6px; }
.alert code { font-family: var(--font-mono); font-size: .85em; background: rgba(16, 24, 40, .06); padding: .05em .35em; border-radius: 4px; }

/* ---------- Units ---------- */
.overview { display: flex; flex-direction: column; gap: 2rem; }
.unit-title {
  display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap;
  margin: 0 0 .6rem; font-size: 1.05rem; font-weight: 700; letter-spacing: -.005em;
}
.unit-count { color: var(--muted); font-size: .76rem; font-weight: 400; }

/* ---------- Quiz ---------- */
.q-list { display: flex; flex-direction: column; gap: .8rem; }
.q {
  background: var(--base-100); border: 1px solid var(--base-300);
  border-radius: 8px; padding: .9rem 1rem .85rem;
}
.q-text { font-size: .9rem; font-weight: 600; line-height: 1.45; }
.q-text p { margin: 0 0 .4rem; }
.q-text p:last-child { margin-bottom: 0; }
.q-text ul, .q-text ol { margin: .2em 0 .5em; padding-left: 1.3em; }
.q-text li { margin: .05em 0; }
.q-text code { background: rgba(16, 24, 40, .06); padding: .04em .28em; border-radius: 3px; font-size: .88em; }
.q-text blockquote { margin: .3em 0; padding-left: .7em; border-left: 2px solid var(--base-300); color: var(--muted); }
.q-text h3, .q-text h4, .q-text h5, .q-text h6 { margin: .55em 0 .2em; font-size: .95em; }

.answer-list { list-style: none; margin: .55rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
.answer {
  display: flex; align-items: flex-start; gap: .4rem;
  padding: .45rem .6rem; border: 1px solid var(--base-300); border-radius: 6px;
  background: #fbfbfc;
  font-size: .84rem; line-height: 1.45; color: #344054;
}
.answer-mark {
  flex: none; width: 1rem; height: calc(1.45 * .84rem);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--success);
}
.answer-mark .icon { width: .9rem; height: .9rem; }
.answer-text { min-width: 0; overflow-wrap: anywhere; }
.answer-text p { margin: 0; }
.answer.is-correct {
  border-color: rgba(46, 125, 85, .4);
  background: rgba(46, 125, 85, .09);
  color: #1f5338; font-weight: 600;
}
.answer-model {
  border-color: rgba(37, 99, 168, .28);
  background: rgba(37, 99, 168, .06);
}

.q-meta {
  display: flex; flex-direction: column;
  gap: .22rem; margin-top: .6rem;
  font-size: .72rem; color: var(--muted);
}
.q-meta-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem; min-width: 0; }
.q-meta-key { flex: none; min-width: 2.8rem; font-weight: 600; color: #344054; }
.q-meta-value { min-width: 0; overflow-wrap: anywhere; }

/* ---------- Chips ---------- */
.chip-row { display: inline-flex; flex-wrap: wrap; gap: .22rem; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; max-width: 100%;
  padding: .06rem .5rem;
  border: 1px solid #d5d9e0; border-radius: 999px;
  background: #f4f5f7; color: #344054;
  font-size: .69rem; font-weight: 500; line-height: 1.45; text-align: left;
  overflow-wrap: anywhere;
}
.chip-ghost { border-color: var(--base-300); background: var(--base-200); color: #475467; }
.chip.is-missing {
  border-color: rgba(180, 35, 24, .3); background: rgba(180, 35, 24, .06);
  color: var(--error); font-weight: 600;
}

/* ---------- Skills ---------- */
.topic-list { display: flex; flex-direction: column; gap: .8rem; }
.topic {
  background: var(--base-100); border: 1px solid var(--base-300);
  border-radius: 8px; overflow: hidden;
}
.topic-head {
  padding: .8rem 1rem .65rem;
  background: #e9ecef; border-bottom: 1px solid #d8dce1;
}
.topic-title-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .55rem; }
.topic-title { margin: 0; font-size: .95rem; font-weight: 700; }
.topic-label { margin-right: .3em; color: var(--muted); font-weight: 400; }
.topic-count { margin-left: auto; color: var(--muted); font-size: .72rem; }
.topic-archived, .skill-archived { color: var(--muted); font-size: .7rem; font-style: italic; }
.topic-desc { margin: .28rem 0 0; color: var(--muted); font-size: .78rem; }

.skill-list { list-style: none; margin: .3rem 0; padding: 0; }
.skill { padding: .65rem 1rem .7rem; }
.skill + .skill { border-top: 1px solid var(--line-soft); }
.skill-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .5rem; }
.skill-badge {
  display: inline-flex; align-items: center; flex: none;
  padding: .02rem .5rem;
  border: 1px solid #c6cdd8; border-radius: 999px;
  background: #eef1f5; color: #344054;
  font-size: .66rem; font-weight: 600; line-height: 1.5;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.skill-name { font-size: .86rem; font-weight: 600; }
.skill-name.is-archived { color: var(--muted); }
.skill-desc { margin: .18rem 0 0; color: var(--muted); font-size: .79rem; line-height: 1.5; }
.skill-meta { display: flex; flex-direction: column; gap: .2rem; margin: .4rem 0 0; }
.skill-detail { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem; margin: 0; font-size: .74rem; color: var(--muted); }
.detail-label { flex: none; min-width: 6.1rem; font-weight: 600; color: #344054; }
.skill-empty { padding: .7rem 1rem; color: var(--muted); font-size: .78rem; font-style: italic; }

.empty { padding: 2.5rem 0; color: var(--muted); font-size: .88rem; }
.empty p { margin: 0; }

/* ---------- Responsive ---------- */
@media (max-width: 640px) {
  .shell { padding: 1rem .6rem 2rem; }
  .page-head { flex-direction: column; gap: .25rem; }
  .view-mark { padding-top: 0; }
  .q, .skill, .topic-head { padding-left: .75rem; padding-right: .75rem; }
  .q-meta-key { min-width: 2.6rem; }
  .detail-label { min-width: 0; }
}

/* ---------- Print ---------- */
@media print {
  body { background: #fff; }
  .view-mark { display: none !important; }
  .shell { max-width: none; padding: 0; }
  .q, .skill, .topic { break-inside: avoid; }
}

  </style>
</head>

  <script>
"use strict";

/* =========================================================================
   GAIA Prüfansicht – gemeinsame Helfer
   Reine Anzeige: keine Bearbeitung, keine Netzwerkzugriffe.
   ========================================================================= */

const $ = (selector, root = document) => root.querySelector(selector);
const isObj = value => value !== null && typeof value === "object" && !Array.isArray(value);
const asArray = value => (Array.isArray(value) ? value : []);
const str = value => (value === null || value === undefined ? "" : String(value));

function esc(value) {
  return str(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[char]));
}

function icon(name, cls = "") {
  return `<svg class="icon ${cls}" aria-hidden="true" focusable="false"><use href="#${name}"></use></svg>`;
}

/* Zeigt eine nicht ausblendbare, erklärende Fehlermeldung an, wenn die
   eingebetteten Daten (exampleData) fehlen oder nicht lesbar sind. Dies
   passiert z. B., wenn beim Einfügen der Daten ein JavaScript-Syntaxfehler
   entsteht – ohne diesen Check würde die Seite dann still leer bleiben. */
function reportFatal(message, detail) {
  const container = $("#alerts");
  if (!container) return;
  const detailHtml = detail
    ? `<details class="alert-detail"><summary>Technischer Hinweis</summary><pre>${esc(detail)}</pre></details>`
    : "";
  container.innerHTML =
    `<div class="alert alert-error" role="alert">
       <span class="alert-icon">${icon("i-alert")}</span>
       <div class="alert-main">
         <strong>Ansicht konnte nicht erzeugt werden.</strong>
         <p>${esc(message)}</p>
         ${detailHtml}
         <p class="alert-hint">Bitte prüfe, ob die Daten korrekt in den <code>exampleData</code>-Block
         dieser HTML-Ansicht eingefügt sind (Datei auf Basis von
         <code>vorlagen/skill_overview.html</code> erzeugen und die Render-Logik
         unverändert lassen).</p>
       </div>
     </div>`;
}

function issueItem(issue) {
  return `<li>${esc(issue.message)}</li>`;
}

function renderIssues(container, issues) {
  if (!container) return;
  const blocks = [];
  if (issues.errors.length) {
    const items = issues.errors;
    const shown = items.slice(0, 8);
    const rest = items.slice(8);
    blocks.push(`<div class="alert alert-error">
      <span class="alert-icon">${icon("i-alert")}</span>
      <div class="alert-main"><strong>${items.length} Fehler</strong><ul>${shown.map(issueItem).join("")}</ul>
      ${rest.length ? `<details><summary>${rest.length} weitere anzeigen</summary><ul>${rest.map(issueItem).join("")}</ul></details>` : ""}</div>
    </div>`);
  }
  if (issues.warnings.length) {
    const items = issues.warnings;
    const shown = items.slice(0, 8);
    const rest = items.slice(8);
    blocks.push(`<div class="alert alert-warning">
      <span class="alert-icon">${icon("i-alert")}</span>
      <div class="alert-main"><strong>${items.length} Hinweise</strong><ul>${shown.map(issueItem).join("")}</ul>
      ${rest.length ? `<details><summary>${rest.length} weitere anzeigen</summary><ul>${rest.map(issueItem).join("")}</ul></details>` : ""}</div>
    </div>`);
  }
  container.innerHTML = blocks.join("");
}

function emptyState(text) {
  return `<div class="empty"><p>${text}</p></div>`;
}

function setDocumentTitle() {
  document.title = `${reviewInfo.title || "Prüfansicht"}${reviewInfo.topic ? ` – ${reviewInfo.topic}` : ""} | GAIA`;
}

  <script>
"use strict";

/* =========================================================================
   SEITE: Themen & Fähigkeiten – statische Prüfansicht
   ========================================================================= */

function findCycles(skills) {
  const byKey = new Map();
  skills.forEach(skill => {
    if (isObj(skill) && str(skill.key)) byKey.set(skill.key, skill);
  });
  const state = new Map();
  const cycles = [];

  const visit = (key, path) => {
    const status = state.get(key);
    if (status === "done") return;
    if (status === "active") {
      const start = path.indexOf(key);
      cycles.push(path.slice(start).concat(key));
      return;
    }
    state.set(key, "active");
    const skill = byKey.get(key);
    asArray(skill?.prerequisites).forEach(requirement => {
      if (requirement !== key && byKey.has(requirement)) visit(requirement, path.concat(key));
    });
    state.set(key, "done");
  };

  byKey.forEach((_skill, key) => visit(key, []));
  return cycles;
}

/* ---------- Prüfung ---------- */
function validateSkills(data) {
  const errors = [];
  const warnings = [];
  const addError = message => errors.push({ message });
  const addWarning = message => warnings.push({ message });

  if (!isObj(data)) {
    addError("Die Datei enthält kein JSON-Objekt.");
    return { errors, warnings };
  }
  if (data.format !== "gaia-skills") {
    addError(`Format ist „${str(data.format) || "–"}“, erwartet wird „gaia-skills“.`);
  }
  if (data.version !== 1) {
    addWarning(`Version ist „${str(data.version) || "–"}“; die Vorlage erwartet Version 1.`);
  }
  if (!Array.isArray(data.topics)) addError("Das Feld „topics“ fehlt oder ist keine Liste.");
  if (!Array.isArray(data.skills)) addError("Das Feld „skills“ fehlt oder ist keine Liste.");
  if (!Array.isArray(data.topics) || !Array.isArray(data.skills)) return { errors, warnings };

  /* Erst alle Schlüssel sammeln, damit Voraussetzungen auch vorwärts verweisen dürfen. */
  const topicKeys = new Map();
  data.topics.forEach((topic, index) => {
    const where = `Thema ${index + 1}`;
    if (!isObj(topic)) {
      addError(`${where}: Eintrag ist kein Objekt.`);
      return;
    }
    const key = str(topic.key);
    if (!key.trim()) {
      addError(`${where}: Der Schlüssel „key“ fehlt.`);
    } else if (topicKeys.has(key)) {
      addError(`${where}: Doppelter Themen-Schlüssel „${key}“ (auch Thema ${topicKeys.get(key)}).`);
    } else {
      topicKeys.set(key, index + 1);
    }
    if (!str(topic.unit).trim()) addWarning(`${where} („${key || "–"}“): Die Einheit „unit“ fehlt.`);
    if (!str(topic.name).trim()) addError(`${where} („${key || "–"}“): Der Anzeigename „name“ fehlt.`);
  });

  const skillKeys = new Map();
  data.skills.forEach((skill, index) => {
    const where = `Skill ${index + 1}`;
    if (!isObj(skill)) {
      addError(`${where}: Eintrag ist kein Objekt.`);
      return;
    }
    const key = str(skill.key);
    if (!key.trim()) {
      addError(`${where}: Der Schlüssel „key“ fehlt.`);
    } else if (skillKeys.has(key)) {
      addError(`${where}: Doppelter Skill-Schlüssel „${key}“ (auch Skill ${skillKeys.get(key)}).`);
    } else {
      skillKeys.set(key, index + 1);
    }
  });

  data.skills.forEach((skill, index) => {
    if (!isObj(skill)) return;
    const where = `Skill ${index + 1}`;
    const key = str(skill.key);
    if (!str(skill.topic_key).trim()) {
      addError(`${where} („${key || "–"}“): Das Feld „topic_key“ fehlt.`);
    } else if (!topicKeys.has(skill.topic_key)) {
      addError(`${where} („${key || "–"}“): „topic_key“ verweist auf ein unbekanntes Thema „${skill.topic_key}“.`);
    }
    if (!str(skill.name).trim()) addError(`${where} („${key || "–"}“): Der Anzeigename „name“ fehlt.`);
    if (!str(skill.concept).trim()) addWarning(`${where} („${key || "–"}“): Das zugrundeliegende Konzept „concept“ fehlt.`);

    if (skill.prerequisites !== undefined && !Array.isArray(skill.prerequisites)) {
      addError(`${where} („${key || "–"}“): „prerequisites“ ist keine Liste.`);
    }
    const seen = new Set();
    asArray(skill.prerequisites).forEach(requirement => {
      const value = str(requirement);
      if (!value.trim()) {
        addError(`${where} („${key || "–"}“): Eine Voraussetzung ist leer.`);
        return;
      }
      if (seen.has(value)) addWarning(`${where} („${key || "–"}“): Voraussetzung „${value}“ ist doppelt.`);
      seen.add(value);
      if (value === key) addError(`${where} („${key}“): Ein Skill kann nicht Voraussetzung für sich selbst sein.`);
      else if (!skillKeys.has(value)) addError(`${where} („${key || "–"}“): Voraussetzung „${value}“ existiert nicht.`);
    });
  });

  findCycles(data.skills).forEach(cycle => {
    addError(`Zyklische Voraussetzungen: ${cycle.join(" → ")}.`);
  });

  const reportedTopics = new Set();
  data.topics.forEach(topic => {
    const key = str(topic.key);
    if (!key || reportedTopics.has(key)) return;
    reportedTopics.add(key);
    if (!data.skills.some(skill => isObj(skill) && skill.topic_key === key)) {
      addWarning(`Thema „${key}“ enthält noch keine Skills.`);
    }
  });

  const unassigned = data.skills.filter(skill => isObj(skill) && str(skill.key) && !topicKeys.has(skill.topic_key));
  if (unassigned.length) {
    addWarning(`${unassigned.length} Skill${unassigned.length === 1 ? "" : "s"} ohne gültiges Thema.`);
  }

  return { errors, warnings };
}

/* ---------- Darstellung ---------- */
function prerequisiteText(skill) {
  const values = asArray(skill.prerequisites).filter(Boolean);
  if (!values.length) return '<span class="muted">Keine</span>';
  const chips = values.map(key => {
    const target = state.skillsByKey.get(key);
    const missing = !target;
    const label = missing ? key : target.name || key;
    return `<span class="chip chip-ghost${missing ? " is-missing" : ""}">${esc(label)}</span>`;
  }).join("");
  return `<span class="chip-row">${chips}</span>`;
}

const state = {
  skillsByKey: new Map(),
};

function renderSkillItem(skill, number) {
  const archived = Boolean(skill.archived);
  return `<li class="skill">
    <div class="skill-head">
      <span class="skill-badge">Skill ${number || "–"}</span>
      <span class="skill-name${archived ? " is-archived" : ""}">${esc(skill.name || "Ohne Namen")}</span>
      ${archived ? '<span class="skill-archived">archiviert</span>' : ""}
    </div>
    ${skill.description ? `<p class="skill-desc">${esc(skill.description)}</p>` : ""}
    <div class="skill-meta">
      ${skill.concept ? `<p class="skill-detail"><span class="detail-label">Konzept</span><span>${esc(skill.concept)}</span></p>` : ""}
      <p class="skill-detail"><span class="detail-label">Voraussetzungen</span><span>${prerequisiteText(skill)}</span></p>
    </div>
  </li>`;
}

function renderTopic(topic, skills, numberBySkill) {
  const archived = Boolean(topic.archived);
  return `<section class="topic">
    <div class="topic-head">
      <div class="topic-title-line">
        <h3 class="topic-title"><span class="topic-label">Thema:</span> ${esc(topic.name || "Ohne Namen")}</h3>
        ${archived ? '<span class="topic-archived">archiviert</span>' : ""}
        <span class="topic-count">${skills.length} ${skills.length === 1 ? "Skill" : "Skills"}</span>
      </div>
      ${topic.description ? `<p class="topic-desc">${esc(topic.description)}</p>` : ""}
    </div>
    ${skills.length
      ? `<ul class="skill-list">${skills.map(skill => renderSkillItem(skill, numberBySkill.get(skill))).join("")}</ul>`
      : '<div class="skill-empty">Noch keine Skills in diesem Thema.</div>'}
  </section>`;
}

function renderOverview(data) {
  const root = $("#overview");
  const topics = asArray(data.topics).filter(isObj);
  const skills = asArray(data.skills).filter(isObj);

  // Position im skills[]-Array der JSON-Datei (1-basiert) – wie in den
  // Validierungsmeldungen, damit Rückmeldungen wie „Skill 14 prüfen“ eindeutig sind.
  const numberBySkill = new Map();
  asArray(data.skills).forEach((skill, index) => {
    if (isObj(skill)) numberBySkill.set(skill, index + 1);
  });

  if (!topics.length && !skills.length) {
    root.innerHTML = emptyState("Für dieses Thema sind noch keine Skills hinterlegt.");
    return;
  }

  const topicsByUnit = new Map();
  topics.forEach(topic => {
    const unit = str(topic.unit) || "Ohne Einheit";
    if (!topicsByUnit.has(unit)) topicsByUnit.set(unit, []);
    topicsByUnit.get(unit).push({
      topic,
      skills: skills.filter(skill => skill.topic_key === topic.key),
    });
  });

  const units = Array.from(topicsByUnit.keys()).filter(unit => unit !== "Ohne Einheit");
  if (topicsByUnit.has("Ohne Einheit")) units.push("Ohne Einheit");

  let html = units.map(unit => {
    const entries = topicsByUnit.get(unit);
    const skillCount = entries.reduce((total, entry) => total + entry.skills.length, 0);
    return `<section class="unit">
      <h2 class="unit-title">${esc(unit)}<span class="unit-count">${entries.length} ${entries.length === 1 ? "Thema" : "Themen"} · ${skillCount} ${skillCount === 1 ? "Skill" : "Skills"}</span></h2>
      <div class="topic-list">${entries
        .map(entry => renderTopic(entry.topic, entry.skills, numberBySkill))
        .join("")}</div>
    </section>`;
  }).join("");

  const knownTopicKeys = new Set(topics.map(topic => topic.key));
  const unassigned = skills.filter(skill => !knownTopicKeys.has(skill.topic_key));
  if (unassigned.length) {
    html += `<section class="unit">
      <h2 class="unit-title">Ohne gültiges Thema<span class="unit-count">${unassigned.length} ${unassigned.length === 1 ? "Skill" : "Skills"}</span></h2>
      <div class="topic-list">
        <section class="topic">
          <div class="topic-head">
            <div class="topic-title-line">
              <h3 class="topic-title"><span class="topic-label">Thema:</span> Nicht zugeordnet</h3>
            </div>
            <p class="topic-desc">Skills ohne vorhandenes Thema</p>
          </div>
          <ul class="skill-list">${unassigned.map(skill => renderSkillItem(skill, numberBySkill.get(skill))).join("")}</ul>
        </section>
      </div>
    </section>`;
  }

  root.innerHTML = html;
}

/* ---------- Start ---------- */
function initSkillsPage() {
  // Besteht ein JavaScript-Syntaxfehler im eingebetteten exampleData-Block, ist die
  // Variable nicht deklariert (ReferenceError beim Zugriff). Das wird hier
  // abgefangen, damit statt einer leeren Seite eine erklärende Meldung erscheint.
  let data;
  try {
    data = isObj(exampleData) ? exampleData : null;
  } catch (err) {
    reportFatal(
      "Die eingebetteten Fähigkeiten-Daten konnten nicht gelesen werden.",
      err && err.message ? err.message : String(err)
    );
    return;
  }
  if (!data) {
    reportFatal(
      "Im exampleData-Block dieser Ansicht sind keine gültigen Daten vorhanden.",
      "exampleData ist undefined oder kein Objekt."
    );
    return;
  }

  const skills = asArray(data.skills).filter(isObj);
  const issues = validateSkills(data);
  state.skillsByKey = new Map(skills.filter(skill => skill.key).map(skill => [skill.key, skill]));
  setDocumentTitle();
  renderIssues($("#alerts"), issues);
  renderOverview(data);
}

initSkillsPage();

  </script>
  <script>
/* Unabhängige Absicherung: Wenn der Daten- oder der Render-Block einen
   JavaScript-Fehler hatte (z. B. Syntaxfehler im eingebetteten exampleData),
   bleibt #overview leer. Dieses eigenständige Skript zeigt dann eine klare
   Meldung – es hängt von keiner anderen Funktion der Seite ab. */
window.addEventListener("DOMContentLoaded", () => {
  try {
    const overview = document.querySelector("#overview");
    if (overview && !overview.innerHTML.trim()) {
      overview.innerHTML =
        '<div class="alert alert-error" role="alert">' +
          '<div class="alert-main">' +
            "<strong>Ansicht konnte nicht erzeugt werden.</strong>" +
            "<p>Die Ansicht blieb leer – sehr wahrscheinlich liegt ein " +
            "JavaScript-Fehler in den eingebetteten Daten (exampleData) oder " +
            "in der Render-Logik vor. Öffne die Browser-Konsole (Entwicklertools) " +
            "für die genaue Fehlermeldung.</p>" +
          "</div>" +
        "</div>";
    }
  } catch (err) {
    /* Auch im Fehlerfall nichts weiter tun – die Seite darf nicht weiter gestört werden. */
  }
});
