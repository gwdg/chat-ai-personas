<html lang="de">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizfragen prüfen | GAIA</title>
  <style>
:root {
  --base-100: #ffffff;
  --base-200: #f5f6f7;
  --base-300: #e0e3e7;
  --line-soft: rgba(16, 24, 40, .08);
  --base-content: #20242b;
  --muted: #667085;
  --primary: #344054;
  --success: #2e7d55;
  --error: #b42318;
  --font-sans: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html { font-size: 16px; color-scheme: light; }
body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--base-200);
  color: var(--base-content);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--primary); text-decoration: underline; text-underline-offset: .15em; }
h1, h2, h3, h4, p { margin-top: 0; }
code, pre { font-family: var(--font-mono); }
.muted { color: var(--muted); }
.icon {
  width: 1em; height: 1em; display: inline-block; flex: none;
  stroke: currentColor; fill: none; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; vertical-align: -.14em;
}
.icon-xs { width: .8em; height: .8em; }

/* ---------- Shell ---------- */
.shell { max-width: 1120px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 1.5rem; margin: 0 0 1.1rem;
}
.page-head h1 { margin: 0 0 .2rem; font-size: 1.4rem; line-height: 1.2; letter-spacing: -.01em; }
.lede { margin: 0; max-width: 62ch; color: var(--muted); font-size: .9rem; }
.view-mark { flex: none; padding-top: .25rem; color: var(--muted); font-size: .75rem; }

/* ---------- Alerts ---------- */
.alerts { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1rem; }
.alerts:empty { display: none; }
.alert {
  display: flex; gap: .55rem; padding: .6rem .8rem;
  border: 1px solid var(--base-300); border-left-width: 3px; border-radius: 6px;
  font-size: .8rem;
}
.alert-icon { margin-top: .1rem; font-size: 1.05rem; flex: none; }
.alert-main { min-width: 0; }
.alert-main strong { display: block; margin-bottom: .15rem; font-size: .83rem; }
.alert ul { margin: .1rem 0 0; padding-left: 1.1rem; }
.alert li { margin: .08rem 0; }
.alert details { margin-top: .25rem; }
.alert summary { cursor: pointer; font-weight: 700; }
.alert-error { border-color: rgba(180, 35, 24, .34); background: rgba(180, 35, 24, .06); color: #8a1c14; }
.alert-warning { border-color: rgba(161, 92, 10, .36); background: rgba(161, 92, 10, .07); color: #7a4608; }
.alert-hint { margin: .6rem 0 0; font-size: .82rem; }
.alert-detail { margin-top: .4rem; }
.alert-detail pre { white-space: pre-wrap; word-break: break-word; font-size: .78rem; background: rgba(16, 24, 40, .05); padding: .45rem .55rem; border-radius: 6px; }
.alert code { font-family: var(--font-mono); font-size: .85em; background: rgba(16, 24, 40, .06); padding: .05em .35em; border-radius: 4px; }

/* ---------- Units ---------- */
.overview { display: flex; flex-direction: column; gap: 2rem; }
.unit-title {
  display: flex; align-items: baseline; gap: .55rem; flex-wrap: wrap;
  margin: 0 0 .6rem; font-size: 1.05rem; font-weight: 700; letter-spacing: -.005em;
}
.unit-count { color: var(--muted); font-size: .76rem; font-weight: 400; }

/* ---------- Quiz ---------- */
.q-list { display: flex; flex-direction: column; gap: .8rem; }
.q {
  background: var(--base-100); border: 1px solid var(--base-300);
  border-radius: 8px; padding: .9rem 1rem .85rem;
}
.q-text { font-size: .9rem; font-weight: 600; line-height: 1.45; }
.q-text p { margin: 0 0 .4rem; }
.q-text p:last-child { margin-bottom: 0; }
.q-text ul, .q-text ol { margin: .2em 0 .5em; padding-left: 1.3em; }
.q-text li { margin: .05em 0; }
.q-text code { background: rgba(16, 24, 40, .06); padding: .04em .28em; border-radius: 3px; font-size: .88em; }
.q-text blockquote { margin: .3em 0; padding-left: .7em; border-left: 2px solid var(--base-300); color: var(--muted); }
.q-text h3, .q-text h4, .q-text h5, .q-text h6 { margin: .55em 0 .2em; font-size: .95em; }
.q-badge-row { display: flex; margin-bottom: .45rem; }
.q-badge {
  display: inline-flex; align-items: center; flex: none;
  padding: .05rem .55rem;
  border: 1px solid #c6cdd8; border-radius: 999px;
  background: #eef1f5; color: #344054;
  font-size: .68rem; font-weight: 600; line-height: 1.5;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

.answer-list { list-style: none; margin: .55rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
.answer {
  display: flex; align-items: flex-start; gap: .4rem;
  padding: .45rem .6rem; border: 1px solid var(--base-300); border-radius: 6px;
  background: #fbfbfc;
  font-size: .84rem; line-height: 1.45; color: #344054;
}
.answer-mark {
  flex: none; width: 1rem; height: calc(1.45 * .84rem);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--success);
}
.answer-mark .icon { width: .9rem; height: .9rem; }
.answer-text { min-width: 0; overflow-wrap: anywhere; }
.answer-text p { margin: 0; }
.answer.is-correct {
  border-color: rgba(46, 125, 85, .4);
  background: rgba(46, 125, 85, .09);
  color: #1f5338; font-weight: 600;
}
.answer-model {
  border-color: rgba(37, 99, 168, .28);
  background: rgba(37, 99, 168, .06);
}

.q-meta {
  display: flex; flex-direction: column;
  gap: .22rem; margin-top: .6rem;
  font-size: .72rem; color: var(--muted);
}
.q-meta-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem; min-width: 0; }
.q-meta-key { flex: none; min-width: 2.8rem; font-weight: 600; color: #344054; }
.q-meta-value { min-width: 0; overflow-wrap: anywhere; }

/* ---------- Chips ---------- */
.chip-row { display: inline-flex; flex-wrap: wrap; gap: .22rem; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; max-width: 100%;
  padding: .06rem .5rem;
  border: 1px solid #d5d9e0; border-radius: 999px;
  background: #f4f5f7; color: #344054;
  font-size: .69rem; font-weight: 500; line-height: 1.45; text-align: left;
  overflow-wrap: anywhere;
}
.chip-ghost { border-color: var(--base-300); background: var(--base-200); color: #475467; }
.chip.is-missing {
  border-color: rgba(180, 35, 24, .3); background: rgba(180, 35, 24, .06);
  color: var(--error); font-weight: 600;
}

/* ---------- Skills ---------- */
.topic-list { display: flex; flex-direction: column; gap: .8rem; }
.topic {
  background: var(--base-100); border: 1px solid var(--base-300);
  border-radius: 8px; overflow: hidden;
}
.topic-head {
  padding: .8rem 1rem .65rem;
  background: #e9ecef; border-bottom: 1px solid #d8dce1;
}
.topic-title-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .55rem; }
.topic-title { margin: 0; font-size: .95rem; font-weight: 700; }
.topic-label { margin-right: .3em; color: var(--muted); font-weight: 400; }
.topic-count { margin-left: auto; color: var(--muted); font-size: .72rem; }
.topic-archived, .skill-archived { color: var(--muted); font-size: .7rem; font-style: italic; }
.topic-desc { margin: .28rem 0 0; color: var(--muted); font-size: .78rem; }

.skill-list { list-style: none; margin: .3rem 0; padding: 0; }
.skill { padding: .65rem 1rem .7rem; }
.skill + .skill { border-top: 1px solid var(--line-soft); }
.skill-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .5rem; }
.skill-name { font-size: .86rem; font-weight: 600; }
.skill-name.is-archived { color: var(--muted); }
.skill-desc { margin: .18rem 0 0; color: var(--muted); font-size: .79rem; line-height: 1.5; }
.skill-meta { display: flex; flex-direction: column; gap: .2rem; margin: .4rem 0 0; }
.skill-detail { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem; margin: 0; font-size: .74rem; color: var(--muted); }
.detail-label { flex: none; min-width: 6.1rem; font-weight: 600; color: #344054; }
.skill-empty { padding: .7rem 1rem; color: var(--muted); font-size: .78rem; font-style: italic; }

.empty { padding: 2.5rem 0; color: var(--muted); font-size: .88rem; }
.empty p { margin: 0; }

/* ---------- Responsive ---------- */
@media (max-width: 640px) {
  .shell { padding: 1rem .6rem 2rem; }
  .page-head { flex-direction: column; gap: .25rem; }
  .view-mark { padding-top: 0; }
  .q, .skill, .topic-head { padding-left: .75rem; padding-right: .75rem; }
  .q-meta-key { min-width: 2.6rem; }
  .detail-label { min-width: 0; }
}

/* ---------- Print ---------- */
@media print {
  body { background: #fff; }
  .view-mark { display: none !important; }
  .shell { max-width: none; padding: 0; }
  .q, .skill, .topic { break-inside: avoid; }
}

/* =========================================================================

const $ = (selector, root = document) => root.querySelector(selector);
const isObj = value => value !== null && typeof value === "object" && !Array.isArray(value);
const asArray = value => (Array.isArray(value) ? value : []);
const str = value => (value === null || value === undefined ? "" : String(value));

function esc(value) {
  return str(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",

}

function icon(name, cls = "") {

/* Zeigt eine nicht ausblendbare, erklärende Fehlermeldung an, wenn die

     </div>`;

function renderIssues(container, issues) {

    blocks.push(`<div class="alert alert-error">

      ${rest.length ? `<details><summary>${rest.length} weitere anzeigen</summary><ul>${rest.map(issueItem).join("")}</ul></details>` : ""}</div>

  if (issues.warnings.length) {

      ${rest.length ? `<details><summary>${rest.length} weitere anzeigen</summary><ul>${rest.map(issueItem).join("")}</ul></details>` : ""}</div>
    </div>`);
  }
  container.innerHTML = blocks.join("");

function emptyState(text) {

function setDocumentTitle() {

  <script>
"use strict";

/* =========================================================================
   SEITE: Quizfragen – statische Prüfansicht
   ========================================================================= */

const TAG_PATTERN = /^[A-Za-zÄÖÜäöüß][A-Za-z0-9ÄÖÜäöüß-]*$/;
const STATUSES = ["active", "draft", "archived"];
const ORIGINS = ["human", "ai", "collab", "literature"];
const TYPE_LABEL = {
  single_choice: "Single Choice",
  multiple_choice: "Multiple Choice",
  open_end: "Open End",
};

/* ---------- Markdown (bewusst klein und sicher) ---------- */
function inlineMd(value) {
  const codes = [];
  let text = esc(value).replace(/`([^`\n]+)`/g, (_match, code) => {
    codes.push(code);
    return `\u0001${codes.length - 1}\u0001`;
  });

  text = text
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/__([^_\n]+)__/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>")
    .replace(/~~([^~\n]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\u0001(\d+)\u0001/g, (_match, index) => `<code>${codes[Number(index)]}</code>`);

  return text;
}

function renderMarkdown(markdown) {
  const source = str(markdown).replace(/\r\n/g, "\n");
  if (!source.trim()) return "";

  const blocks = [];
  const tokenized = source.replace(/```([\s\S]*?)```/g, (_match, code) => {
    blocks.push(code.replace(/\n$/, ""));
    return `\u0002BLOCK${blocks.length - 1}\u0002`;
  });

  let html = "";
  let paragraph = [];
  let list = null;

  const flushParagraph = () => {
    if (paragraph.length) {
      html += `<p>${paragraph.map(inlineMd).join("<br>")}</p>`;
      paragraph = [];
    }
  };
  const flushList = () => {
    if (list) {
      html += `<${list.tag}>${list.items.map(item => `<li>${inlineMd(item)}</li>`).join("")}</${list.tag}>`;
      list = null;
    }
  };

  for (const rawLine of tokenized.split("\n")) {
    const line = rawLine.trimEnd();
    const blockMatch = line.match(/^\u0002BLOCK(\d+)\u0002$/);
    if (blockMatch) {
      flushParagraph();
      flushList();
      html += `<pre><code>${esc(blocks[Number(blockMatch[1])])}</code></pre>`;
      continue;
    }
    if (!line.trim()) {
      flushParagraph();
      flushList();
      continue;
    }
    let match;
    if ((match = line.match(/^(#{1,4})\s+(.*)$/))) {
      flushParagraph();
      flushList();
      const level = Math.min(6, match[1].length + 2);
      html += `<h${level}>${inlineMd(match[2])}</h${level}>`;
      continue;
    }
    if ((match = line.match(/^>\s?(.*)$/))) {
      flushParagraph();
      flushList();
      html += `<blockquote>${inlineMd(match[1])}</blockquote>`;
      continue;
    }
    if ((match = line.match(/^\s*[-*+]\s+(.*)$/))) {
      flushParagraph();
      if (!list || list.tag !== "ul") {
        flushList();
        list = { tag: "ul", items: [] };
      }
      list.items.push(match[1]);
      continue;
    }
    if ((match = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      flushParagraph();
      if (!list || list.tag !== "ol") {
        flushList();
        list = { tag: "ol", items: [] };
      }
      list.items.push(match[1]);
      continue;
    }
    flushList();
    paragraph.push(line);
  }
  flushParagraph();
  flushList();
  return html;
}

function stripMarkdown(markdown, maxLength = 220) {
  // Code-Inhalte (inline und Block) schützen: In C-Code sind * _ ~ ~ ~
  // semantisch bedeutsam (z. B. Zeiger-`*`, Operator `*=`) und dürfen bei der
  // Markdown-Emphasis-Bereinigung NICHT entfernt werden, sonst entstehen
  // falsche „doppelte Antworten“ (z. B. `x *= 3;` vs. `x =* 3;`).
  const codeSpans = [];
  let text = str(markdown)
    .replace(/\$\$[\s\S]+?\$\$/g, "[Formel]")
    .replace(/```[\s\S]*?```/g, (m) => { codeSpans.push(m); return `[Code${codeSpans.length - 1}]`; })
    .replace(/`([^`]+)`/g, (m, inner) => { codeSpans.push(inner); return `[Code${codeSpans.length - 1}]`; })
    .replace(/!\[[^\]]*\]\([^)]*\)/g, "[Bild]")
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/^#{1,6}\s+/gm, "")
    .replace(/^>\s?/gm, "")
    .replace(/^[-*+]\s+/gm, "")
    .replace(/^\d+[.)]\s+/gm, "")
    // Nur Markdown-Emphasis-Spannungen normalisieren, nicht einzelne Zeichen:
    // `*`, `_`, `~` sind in C-Code semantisch bedeutsam (z. B. Zeiger-`*`,
    // Operator `*=`, `int **`). Pauschales Entfernen würde sonst echte,
    // verschiedene Antworten wie `x *= 3;` und `x =* 3;` fälschlich als gleich
    // erkennen (falsche „doppelte Antworten“). Stattdessen nur gepaarte
    // Emphasis-Marker auflösen.
    .replace(/[*_~]([^*_~\s][^*_~]*?)[*_~]/g, "$1")
    .replace(/\s+/g, " ")
    .trim();
  // Geschützte Code-Inhalte wieder einsetzen.
  codeSpans.forEach((code, i) => { text = text.replace(`[Code${i}]`, code.trim()); });
  if (text.length > maxLength) {
    text = `${text.slice(0, maxLength - 1).trimEnd()}…`;
  }
  return text;
}

function skillMeta(key) {
  const raw = skillMap ? skillMap[key] : undefined;
  if (isObj(raw)) {
    return {
      name: str(raw.name) || key,
      unit: str(raw.unit) || str(skillToUnit ? skillToUnit[key] : "") || "Ohne Einheit",
      known: true,
    };
  }
  return {
    name: str(raw) || key,
    unit: str(skillToUnit ? skillToUnit[key] : "") || "Ohne Einheit",
    known: raw !== undefined && raw !== null && raw !== "",
  };
}

function hasSkillMap() {
  return isObj(skillMap) && Object.keys(skillMap).length > 0;
}

function unitForQuestion(question) {
  for (const key of asArray(question.skills)) {
    const meta = skillMeta(key);
    if (meta.known && meta.unit) return meta.unit;
  }
  return "Ohne Einheit";
}

/* ---------- Prüfung ---------- */
function validateQuiz(data) {
  const errors = [];
  const warnings = [];
  const addError = message => errors.push({ message });
  const addWarning = message => warnings.push({ message });

  if (!isObj(data)) {
    addError("Die Datei enthält kein JSON-Objekt.");
    return { errors, warnings };
  }
  if (data.format !== "gaia-quiz") {
    addError(`Format ist „${str(data.format) || "–"}“, erwartet wird „gaia-quiz“.`);
  }
  if (data.version !== 1) {
    addWarning(`Version ist „${str(data.version) || "–"}“; die Vorlage erwartet Version 1.`);
  }
  if (!Array.isArray(data.questions)) {
    addError("Das Feld „questions“ fehlt oder ist keine Liste.");
    return { errors, warnings };
  }

  const questionSkills = new Map();
  const seenQuestions = new Map();

  /* Sammelindikatoren für abschließende Querschnitts-CHECKS: */
  const typeCounts = { single_choice: 0, multiple_choice: 0, open_end: 0 };
  const correctPositionCounts = {}; // Position (1-basiert) -> Anzahl der Single-Choice-Fragen mit genau dieser richtigen Position
  const scWeightSum = []; // je Single-Choice-Frage: 1 / Anzahl der Antwortoptionen (für das gewichtete "Soll")

  data.questions.forEach((question, index) => {
    const where = `Frage ${index + 1}`;
    if (!isObj(question)) {
      addError(`${where}: Eintrag ist kein Objekt.`);
      return;
    }

    const type = str(question.type);
    if (!TYPE_LABEL[type]) {
      addError(`${where}: Unbekannter Typ „${type || "–"}“ (erlaubt: single_choice, multiple_choice, open_end).`);
    } else {
      typeCounts[type] = (typeCounts[type] || 0) + 1;
    }

    const questionText = str(question.question);
    if (!questionText.trim()) {
      addError(`${where}: Der Fragetext fehlt.`);
    } else {
      const normalized = stripMarkdown(questionText).toLocaleLowerCase("de");
      if (normalized && seenQuestions.has(normalized)) {
        addWarning(`${where}: Fragetext ähnelt Frage ${seenQuestions.get(normalized)}.`);
      } else if (normalized) {
        seenQuestions.set(normalized, index + 1);
      }
    }

    const answers = asArray(question.answers);
    if (!Array.isArray(question.answers)) {
      addError(`${where}: Das Feld „answers“ fehlt oder ist keine Liste.`);
    } else if (!answers.length) {
      addError(`${where}: Es fehlen Antwortoptionen.`);
    } else if (type !== "open_end" && answers.length < 2) {
      addError(`${where}: Auswahlfragen brauchen mindestens zwei Antwortoptionen.`);
    } else if (type === "open_end" && answers.length !== 1) {
      addWarning(`${where}: Open-End-Fragen haben genau eine Musterantwort (${answers.length} gefunden).`);
    }

    const nonEmptyAnswers = new Set();
    answers.forEach((answer, answerIndex) => {
      if (!str(answer).trim()) {
        addError(`${where}: Antwort ${answerIndex + 1} ist leer.`);
        return;
      }
      const normalized = stripMarkdown(answer).toLocaleLowerCase("de");
      if (nonEmptyAnswers.has(normalized)) {
        addWarning(`${where}: Antwort ${answerIndex + 1} ist doppelt.`);
      }
      nonEmptyAnswers.add(normalized);
    });

    const correct = asArray(question.correct);
    if (type === "open_end") {
      if (correct.length) {
        addError(`${where}: Open-End-Fragen haben keine „correct“-Einträge.`);
      }
    } else if (!Array.isArray(question.correct) || !correct.length) {
      addError(`${where}: Für Auswahlfragen fehlt mindestens eine richtige Antwort in „correct“.`);
    } else {
      const seen = new Set();
      correct.forEach(value => {
        if (!Number.isInteger(value)) {
          addError(`${where}: „correct“ enthält den Nicht-Integer-Wert ${JSON.stringify(value)}.`);
          return;
        }
        if (value < 1 || value > answers.length) {
          addError(`${where}: „correct“ verweist auf Position ${value}, es gibt aber nur ${answers.length} Antworten.`);
        }
        if (seen.has(value)) {
          addWarning(`${where}: Position ${value} steht mehrfach in „correct“.`);
        }
        seen.add(value);
      });
      if (type === "single_choice" && correct.length !== 1) {
        addError(`${where}: Single Choice braucht genau eine richtige Antwort (${correct.length} gefunden).`);
      }
      if (type === "multiple_choice") {
        // Multiple Choice: 1 bis n-1 richtige Antworten sind legitim; auch 1 oder 3+.
        if (correct.length >= answers.length) {
          addError(`${where}: Multiple Choice darf nicht alle ${answers.length} Antworten als richtig markieren. Höchstens ${answers.length - 1} dürfen richtig sein (mindestens 1).`);
        } else if (correct.length < 1) {
          addError(`${where}: Multiple Choice braucht mindestens eine richtige Antwort.`);
        }
      }
      if (type === "single_choice" && correct.length === 1 && Number.isInteger(correct[0])) {
        const pos = correct[0];
        if (pos >= 1 && pos <= answers.length) {
          correctPositionCounts[pos] = (correctPositionCounts[pos] || 0) + 1;
          scWeightSum.push(1 / answers.length);
        }
      }
    }

    if (question.skills !== undefined && !Array.isArray(question.skills)) {
      addError(`${where}: Das Feld „skills“ ist keine Liste.`);
    }
    const seenSkills = new Set();
    asArray(question.skills).forEach(key => {
      if (!str(key).trim()) {
        addError(`${where}: Ein Skill-Eintrag ist leer.`);
        return;
      }
      if (seenSkills.has(key)) {
        addWarning(`${where}: Skill „${key}“ ist mehrfach zugeordnet.`);
      }
      seenSkills.add(key);
      questionSkills.set(key, (questionSkills.get(key) || 0) + 1);
      if (hasSkillMap() && !skillMeta(key).known) {
        addError(`${where}: Skill „${key}“ ist in skillMap nicht vorhanden.`);
      }
    });

    if (question.tags !== undefined && !Array.isArray(question.tags)) {
      addError(`${where}: Das Feld „tags“ ist keine Liste.`);
    }
    const seenTags = new Set();
    asArray(question.tags).forEach(tag => {
      const value = str(tag);
      if (!value.trim()) {
        addError(`${where}: Ein Tag ist leer.`);
        return;
      }
      if (seenTags.has(value)) {
        addWarning(`${where}: Tag „${value}“ ist doppelt.`);
      }
      seenTags.add(value);
      if (value.length > 24) {
        addWarning(`${where}: Tag „${value}“ ist länger als 24 Zeichen.`);
      }
      if (!TAG_PATTERN.test(value)) {
        addWarning(`${where}: Tag „${value}“ entspricht nicht der GAIA-Regel (Buchstabe, dann Buchstaben, Ziffern oder Bindestrich).`);
      }
    });

    const status = str(question.status);
    if (status && !STATUSES.includes(status)) {
      addError(`${where}: Unbekannter Status „${status}“ (erlaubt: active, draft, archived).`);
    }
    const origin = str(question.origin);
    if (origin && !ORIGINS.includes(origin)) {
      addError(`${where}: Unbekannte Herkunft „${origin}“ (erlaubt: human, ai, collab, literature).`);
    }
    if (str(question.source).trim() && origin !== "literature") {
      addWarning(`${where}: „source“ ist nur für origin „literature“ vorgesehen.`);
    }
    if (origin === "literature" && !str(question.source).trim()) {
      addWarning(`${where}: Origin „literature“ ohne Quellenangabe in „source“.`);
    }
  });

  if (hasSkillMap()) {
    Object.keys(skillMap).forEach(key => {
      const count = questionSkills.get(key) || 0;
      if (count === 0) {
        addWarning(`Skill „${key}“ hat noch keine Quizfrage (empfohlen: mindestens 2).`);
      } else if (count === 1) {
        addWarning(`Skill „${key}“ hat nur eine Quizfrage (empfohlen: mindestens 2).`);
      }
    });
  } else {
    questionSkills.forEach((count, key) => {
      if (count === 1) addWarning(`Skill „${key}“ hat nur eine Quizfrage (empfohlen: mindestens 2).`);
    });
  }

  /* Querschnitts-Check: Verteilung der richtigen Antwortposition (single_choice) */
  const positions = Object.keys(correctPositionCounts).map(Number);
  const posTotal = positions.reduce((sum, p) => sum + (correctPositionCounts[p] || 0), 0);
  if (posTotal >= 5) {
    // Gewichtetes "Soll" je Position: durchschnittlicher Anteil, der bei gleichmäßiger
    // Verteilung zu erwarten wäre (100 % / Anzahl Optionen, z. B. 25 % bei 4 Optionen).
    const sollPerPosition = scWeightSum.reduce((a, b) => a + b, 0) / posTotal;
    // Spielraum: erst ab Soll + 15 Prozentpunkte warnen (z. B. 4 Optionen: ab ~40 %).
    const warningPegel = sollPerPosition + 0.15;
    positions.forEach(p => {
      const share = (correctPositionCounts[p] || 0) / posTotal;
      if (share > warningPegel) {
        addWarning(`Richtige Antwort liegt in ${correctPositionCounts[p]} von ${posTotal} Single-Choice-Fragen auf Position ${p} (${Math.round(share * 100)} %). Erwartet wären gleichmäßig etwa ${Math.round(sollPerPosition * 100)} % je Position; gewarnt wird erst ab ${Math.round(warningPegel * 100)} % (mit Spielraum).`);
      }
    });
  }

  /* Querschnitts-Check: sinnvoller Mix der Fragetypen */
  const typeTotal = typeCounts.single_choice + typeCounts.multiple_choice + typeCounts.open_end;
  if (typeTotal >= 5) {
    const usedTypes = ["single_choice", "multiple_choice", "open_end"].filter(t => typeCounts[t] > 0);
    if (usedTypes.length === 1 && usedTypes[0] !== "single_choice") {
      addWarning(`Es wird nur ${usedTypes[0]} verwendet. Ein didaktisch sinnvoller Mix (viel single_choice/multiple_choice, wenige open_end) ist anzustreben.`);
    }
    const openShare = typeCounts.open_end / typeTotal;
    if (usedTypes.length > 1 && openShare > 0.5) {
      addWarning(`Open-End-Fragen machen ${Math.round(openShare * 100)} % aller Fragen aus. Open-End sollte insgesamt seltener eingesetzt werden, da es für Nutzende aufwändiger ist.`);
    }
    if (usedTypes.length > 1 && typeCounts.single_choice > 0 && typeCounts.multiple_choice === 0) {
      addWarning(`Es werden single_choice und open_end, aber keine multiple_choice-Fragen verwendet. Erwäge einen Mix der Auswahltypen.`);
    }
  }

  return { errors, warnings };
}

/* ---------- Darstellung ---------- */
function skillText(keys) {
  const values = asArray(keys).filter(Boolean);
  if (!values.length) return '<span class="muted">–</span>';
  const chips = values.map(key => {
    const meta = skillMeta(key);
    const missing = hasSkillMap() && !meta.known;
    return `<span class="chip${missing ? " is-missing" : ""}">${esc(meta.name)}</span>`;
  }).join("");
  return `<span class="chip-row">${chips}</span>`;
}

function tagText(tags) {
  const values = asArray(tags).filter(Boolean);
  if (!values.length) return '<span class="muted">–</span>';
  return values.map(tag => `<span>${esc(tag)}</span>`).join(", ");
}

function renderAnswers(question) {
  const answers = asArray(question.answers);
  if (!answers.length) {
    return '<p class="skill-empty" style="padding:.2rem 0">Keine Antworten hinterlegt.</p>';
  }
  if (question.type === "open_end") {
    return `<ul class="answer-list">
      <li class="answer answer-model">
        <span class="answer-text">${answers[0] ? renderMarkdown(answers[0]) : '<span class="muted">Keine Musterantwort</span>'}</span>
      </li>
    </ul>`;
  }
  const correct = new Set(asArray(question.correct).filter(value => Number.isInteger(value)));
  return `<ul class="answer-list">${answers.map((answer, index) => {
    const isCorrect = correct.has(index + 1);
    return `<li class="answer ${isCorrect ? "is-correct" : ""}">
      <span class="answer-mark">${isCorrect ? icon("i-check", "icon-xs") : ""}</span>
      <span class="answer-text">${renderMarkdown(answer)}</span>
    </li>`;
  }).join("")}</ul>`;
}

function renderQuestionCard(question, number) {
  const source = str(question.source).trim();
  return `<article class="q">
    <div class="q-badge-row"><span class="q-badge">Frage ${number || "–"}</span></div>
    <div class="q-text">${question.question ? renderMarkdown(question.question) : '<span class="muted">Fragetext fehlt</span>'}</div>
    ${renderAnswers(question)}
    <div class="q-meta">
      <div class="q-meta-line"><span class="q-meta-key">Skills</span><span class="q-meta-value">${skillText(question.skills)}</span></div>
      <div class="q-meta-line"><span class="q-meta-key">Tags</span><span class="q-meta-value">${tagText(question.tags)}</span></div>
      ${source ? `<div class="q-meta-line"><span class="q-meta-key">Quelle</span><span class="q-meta-value">${esc(source)}</span></div>` : ""}
    </div>
  </article>`;
}

function renderOverview(questions) {
  const root = $("#overview");
  if (!questions.length) {
    root.innerHTML = emptyState("Für dieses Thema sind noch keine Quizfragen hinterlegt.");
    return;
  }

  const numberByQuestion = new Map();
  questions.forEach((question, index) => {
    if (isObj(question)) numberByQuestion.set(question, index + 1);
  });

  const groups = new Map();
  questions.forEach(question => {
    const unit = unitForQuestion(question);
    if (!groups.has(unit)) groups.set(unit, []);
    groups.get(unit).push(question);
  });

  const units = Array.from(groups.keys()).filter(unit => unit !== "Ohne Einheit");
  if (groups.has("Ohne Einheit")) units.push("Ohne Einheit");

  root.innerHTML = units.map(unit => {
    const entries = groups.get(unit);
    return `<section class="unit">
      <h2 class="unit-title">${esc(unit)}<span class="unit-count">${entries.length} ${entries.length === 1 ? "Frage" : "Fragen"}</span></h2>
      <div class="q-list">${entries.map(question => renderQuestionCard(question, numberByQuestion.get(question))).join("")}</div>
    </section>`;
  }).join("");
}

/* ---------- Start ---------- */
function initQuizPage() {
  // Besteht ein JavaScript-Syntaxfehler im eingebetteten exampleData-Block, ist die
  // Variable nicht deklariert (ReferenceError beim Zugriff). Das wird hier
  // abgefangen, damit statt einer leeren Seite eine erklärende Meldung erscheint.
  let data;
  try {
    data = isObj(exampleData) ? exampleData : null;
  } catch (err) {
    reportFatal(
      "Die eingebetteten Quiz-Daten konnten nicht gelesen werden.",
      err && err.message ? err.message : String(err)
    );
    return;
  }
  if (!data) {
    reportFatal(
      "Im exampleData-Block dieser Ansicht sind keine gültigen Daten vorhanden.",
      "exampleData ist undefined oder kein Objekt."
    );
    return;
  }

  const questions = asArray(data.questions);
  const issues = validateQuiz(data);
  setDocumentTitle();
  renderIssues($("#alerts"), issues);
  renderOverview(questions);
}

initQuizPage();

  </script>
  <script>
/* Unabhängige Absicherung: Wenn der Daten- oder der Render-Block einen
   JavaScript-Fehler hatte (z. B. Syntaxfehler im eingebetteten exampleData),
   bleibt #overview leer. Dieses eigenständige Skript zeigt dann eine klare
   Meldung – es hängt von keiner anderen Funktion der Seite ab. */
window.addEventListener("DOMContentLoaded", () => {
  try {
    const overview = document.querySelector("#overview");
    if (overview && !overview.innerHTML.trim()) {
      overview.innerHTML =
        '<div class="alert alert-error" role="alert">' +
          '<div class="alert-main">' +
            "<strong>Ansicht konnte nicht erzeugt werden.</strong>" +
            "<p>Die Ansicht blieb leer – sehr wahrscheinlich liegt ein " +
            "JavaScript-Fehler in den eingebetteten Daten (exampleData) oder " +
            "in der Render-Logik vor. Öffne die Browser-Konsole (Entwicklertools) " +
            "für die genaue Fehlermeldung.</p>" +
          "</div>" +
        "</div>";
    }
  } catch (err) {
    /* Auch im Fehlerfall nichts weiter tun – die Seite darf nicht weiter gestört werden. */
  }
});
  </script>
